name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For `protection-drift` only. Its failure mode is a repository SETTINGS
  # change, which no PR-time check can observe, so it needs a trigger that is
  # not tied to someone pushing code.
  schedule:
    - cron: "17 6 * * *"
  # NOTE on what is deliberately NOT here: `branch_protection_rule`.
  #
  # A previous revision added that trigger with a comment promising detection
  # "the moment someone changes branch protection". It cannot deliver that on
  # this repository. `branch_protection_rule` is the CLASSIC branch-protection
  # event, and `main` here has no classic protection at all
  # (`GET /repos/edgeorgie/agentlens/branches/main/protection` → 404 "Branch not
  # protected"); all protection comes from a ruleset, deliberately, because a
  # ruleset is the only form a workflow can read (see
  # scripts/check-live-protection.mjs). Ruleset changes emit `repository_ruleset`
  # instead, and that event is not a workflow trigger — it does not appear in
  # GitHub's "Events that trigger workflows" reference and there is no `on:` key
  # for it. So editing the ruleset's required contexts — the exact #13 scenario
  # this guard exists for — produced no event and no run, while the comment
  # claimed otherwise.
  #
  # The cron above is therefore the real detection path, with a worst case of
  # ~24h. Genuine instant detection needs a repository webhook on
  # `repository_ruleset` forwarding to `repository_dispatch`; that is a real
  # option, not done here, and it is honest to say the latency is a day rather
  # than ship a trigger that cannot fire.
  workflow_dispatch:

# Pinned explicitly so a change to the repository-level default cannot
# silently widen this job's token. (The repo default is already `read`, so
# this drops nothing today — it is defense against that setting changing.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs. On `main`, the superseded run is the only
  # evidence that commit ever built, so a burst of merges must not leave an
  # intermediate commit with no completed CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares `engines.node: >=20`, and
        # test/required-status-checks.test.mjs asserts that floor is a matrix
        # entry — so the declared support range is exercised at both ends
        # rather than merely advertised.
        #
        # Node 20 is PAST end-of-life (2026-04-30, nodejs/Release
        # schedule.json) and is kept deliberately: it is the declared `engines`
        # floor, so dropping it would leave the floor untested again, which is
        # the defect this guard exists to catch. The honest options are to test
        # it or to stop claiming it. Raising the floor to 22 and dropping 20 is
        # the right next step; it is a consumer-visible narrowing and belongs
        # in its own change, not bundled here.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci`, NOT `npm install`: `npm install` rewrites a lockfile that
      # cannot satisfy package.json, so CI would validate a tree that is not
      # the committed one.
      #
      # `--include=dev` is explicit on purpose. Every tool this job runs
      # (typescript) is a devDependency, so if NODE_ENV ever arrives as
      # `production` npm silently installs nothing and the next step fails
      # with a confusing `tsc: not found` (exit 127). Do not rely on the
      # absence of NODE_ENV for correctness here.
      #
      # `--ignore-scripts`: no package in this tree declares an install
      # lifecycle script, so this costs nothing today and keeps install-time
      # code execution off by default as the tree grows.
      - run: npm ci --include=dev --ignore-scripts
      # `npm run build` typechecks `src/` only: tsconfig.json's `include` is
      # `src/**/*.ts`, so it never saw `bin/cli.mjs` — the file named in
      # package.json's `bin`, i.e. the one every `npx agentlens` invocation
      # actually executes. A typo in an argv branch there shipped to npm with
      # this gate green.
      #
      # `typecheck:bin` closes that with a separate `allowJs`+`checkJs` config
      # (`tsconfig.check.json`, `noEmit` — the file is published verbatim and
      # must never be overwritten by a compile step). It depends on `dist/`
      # existing for the `../dist/index.js` import, which is why it runs AFTER
      # build, not before.
      #
      # Scope is the published entrypoint only. `examples/` and `test/` stay
      # unchecked on purpose: ~40 of the 47 errors `checkJs` reports repo-wide
      # are implicit-any in those dev-only fixtures, where a type error cannot
      # reach a consumer. Widening to them is a separate pass, not a silent
      # `include` edit.
      - run: npm run build
      - run: npm run typecheck:bin
      - run: npm test
      # Written to a temp path: the committed examples/demo-trace.* carry
      # fresh UUIDs and timestamps on every run, so pointing the demo at the
      # repo would leave CI with a dirty tree and make the step's own output
      # indistinguishable from the committed fixture.
      - run: npm run demo:ci
      # `--omit=dev` was wrong here: this package has ZERO entries under
      # `dependencies`, so the production tree is empty and the audit could not
      # fail at any severity — a step that reported green unconditionally. The
      # whole toolchain is a devDependency, which is exactly what a supply-chain
      # audit of this repo needs to cover, so audit the full tree.
      #
      # `--audit-level=high` and not `critical`: high is the lowest threshold
      # that does not make the gate permanently red on a transitive advisory
      # with no patch path. `|| true` is deliberately NOT used — a gate that
      # cannot fail is the defect being fixed, not a style preference.
      - run: npm audit --audit-level=high

  # Asserts that the LIVE ruleset on `main` requires exactly the contexts the
  # matrix above produces. The unit test in `test/` can only prove
  # `mirror == workflow`; this proves `live protection == workflow`, which is
  # the half that actually wedges `main`.
  #
  # Deliberately NOT a required status check, and deliberately not in the
  # matrix job: it calls api.github.com, so a GitHub API incident would turn it
  # red, and a network-dependent required context means an outage blocks
  # merging — the exact deadlock this job exists to detect. It reports drift
  # without holding the merge gate hostage.
  #
  # Skipped on pull_request: a PR cannot change repository settings, so there
  # is nothing new for it to observe, and running it on forked PRs would spend
  # an API call per push for a result that cannot differ from the scheduled one.
  protection-drift:
    name: Branch protection drift
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # `metadata: read` (implied by `contents: read`) is what
      # GET /rules/branches/{branch} needs, and the reason this check is
      # possible at all. Classic branch protection required `administration`,
      # which GITHUB_TOKEN cannot be granted, so the live state was unreadable
      # from a workflow until `main` was migrated to a ruleset.
      #
      # It is NOT sufficient for everything the script would like to read:
      # `bypass_actors` on GET /rulesets/{id} is returned only to callers with
      # WRITE access to the ruleset (`Administration: write`), which
      # GITHUB_TOKEN cannot have. An earlier revision of this file claimed
      # metadata-read covered it; that was wrong, and the script's `?? []`
      # turned the withheld field into a confident "no bypass actors". See
      # ALLOW_UNVERIFIED_BYPASS_ACTORS below.
      contents: read
      # For the failure issue below. Without it nothing surfaces a red
      # scheduled run except a notification email to whoever last touched the
      # cron — which is nobody, for a workflow that runs unattended.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # This step is NEW, and the comment it replaces said the opposite: "No
      # `npm ci`: the script imports only node: builtins and uses global fetch".
      # That is no longer true. `scripts/ci-contexts.mjs` now parses ci.yml with
      # the `yaml` package instead of scanning it line by line, because five
      # successive line-scanning implementations were each bypassed and a merge
      # key (`<<: *anchor`) is invisible to any of them by construction. The
      # dependency is the price of a derivation that cannot be fooled by
      # reformatting, and it is a devDependency only — `dependencies` is empty
      # and `files` ships just dist/, bin/ and README.md, so the published
      # package's install surface is unchanged.
      #
      # `--ignore-scripts` keeps install-time code execution off. The added
      # failure mode (a registry outage reds this job) is acceptable precisely
      # because this job is NOT a required status check, and the `failure()`
      # step below now survives a failure that happens before drift.log exists.
      - run: npm ci --include=dev --ignore-scripts
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN structurally cannot read `bypass_actors` (see the
          # permissions comment above), and the script now FAILS on an
          # unreadable field rather than reporting a false all-clear. Without
          # this flag that correct new behaviour would make this job red every
          # single day — and file an issue — for a blind spot rather than for
          # actual drift, which trains the reader to ignore it.
          #
          # So the blind spot is accepted EXPLICITLY here: with this set the
          # script prints "bypass actors NOT VERIFIED" in its ✓ line and a ⚠
          # per ruleset, instead of claiming there are none. Every assertion it
          # CAN make (required contexts, strict policy, deletion,
          # non_fast_forward) still runs and still fails the job.
          #
          # To make this a real check rather than a disclosed gap, give the step
          # a PAT or GitHub App token with `Administration: write` and remove
          # this line.
          ALLOW_UNVERIFIED_BYPASS_ACTORS: "1"
        # `set -o pipefail` is load-bearing, not boilerplate: without it the
        # pipeline's exit code is `tee`'s, which is always 0, so a failing check
        # would report SUCCESS and the `failure()` step below would never run.
        # Verified: `false | tee x` exits 0 under bash's default settings.
        run: |
          set -o pipefail
          node scripts/check-live-protection.mjs 2>&1 | tee drift.log
      # Because this job is NOT a required status check, a red run blocks
      # nothing and would otherwise be seen by nobody. One deduplicated issue
      # is the notification path: reopened and commented if it already exists,
      # so a persistent problem does not spawn an issue per day.
      #
      # Deduplication is by LABEL, not by searching the title text. The
      # previous version ran `gh issue list --search "$TITLE in:title"`, which
      # is a word query over a bag of common words (branch, protection, main,
      # drifted, ci.yml) — `in:title` restricts the field but does not make it
      # a phrase match — then took `.[0]` of a relevance-ordered list with no
      # client-side equality check. The success path below would then comment on
      # and CLOSE whatever that happened to be. A label is an exact, indexed
      # attribute, and the jq filter additionally requires an exact title match,
      # so both paths resolve to the same issue or to none.
      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Branch protection on `main` has drifted from ci.yml"
          LABEL: protection-drift
        run: |
          # `|| echo ...` and `2>/dev/null`: this step runs on ANY earlier
          # failure in the job, including a checkout or setup-node failure that
          # happens before drift.log is ever created. The default shell is
          # `bash -e {0}`, so a failing command substitution inside an
          # assignment aborts the step — which meant NO issue was filed in
          # exactly the most opaque failure case, the one this notification
          # path exists for.
          log=$(cat drift.log 2>/dev/null || echo '(no drift.log — the job failed before the check step ran; see the run log)')
          body=$'The scheduled `protection-drift` check failed. `main`\'s live ruleset no longer matches the status checks `ci.yml` produces, which can leave the branch unmergeable or unguarded.\n\nRun: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n```\n'"$log"$'\n```'
          # --state all so a previously closed issue is reopened rather than
          # duplicated. The success path uses the same --state for symmetry:
          # when the two paths disagreed about state they could resolve to
          # different issues.
          # `--jq` here is gh's built-in jq, which does NOT accept `--arg`
          # (verified: it reports "unknown arguments"), so the title is passed
          # through the environment and read as `env.TITLE`.
          existing=$(gh issue list --label "$LABEL" --state all \
            --json number,state,title \
            --jq 'map(select(.title == env.TITLE)) | .[0] | select(.) | "\(.number) \(.state)"')
          if [ -n "$existing" ]; then
            num=${existing%% *}
            state=${existing##* }
            # `if`, not `[ … ] && cmd`: under `bash -e` an `a && b` whose `a` is
            # false evaluates to exit 1, which fails the step if it is the last
            # command. The old form was safe only because another command
            # happened to follow it.
            if [ "$state" = "CLOSED" ]; then
              gh issue reopen "$num"
            fi
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
      # Closes the issue once the drift is gone, so a stale open issue does not
      # become the new thing nobody trusts.
      - if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Branch protection on `main` has drifted from ci.yml"
          LABEL: protection-drift
        run: |
          # Same label, same --state, same exact-title filter as the failure
          # path, so the two cannot resolve to different issues. `select(.state
          # == "OPEN")` is applied after the exact match rather than via
          # `--state open`, so the query is identical and only the action
          # differs.
          num=$(gh issue list --label "$LABEL" --state all \
            --json number,state,title \
            --jq 'map(select(.title == env.TITLE and .state == "OPEN")) | .[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Drift resolved: the live ruleset now matches \`ci.yml\`. Closing."
            gh issue close "$num"
          fi


